MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: ''  # set via CLI override; should point to torchvision ResNet-50 weights
  NAME: 'resnet50'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  LAST_STRIDE: 1
  PARASITIC_SCOPE: 'all'
  PARASITIC_TYPE: 'gamma_beta'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: './data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 64
  BASE_LR: 0.00035
  PARASITIC_LR_MULT: 5.0
  BIAS_LR_FACTOR: 1
  OPTIMIZER_NAME: 'Adam'
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0005
  MAX_EPOCHS: 120
  STEPS: [40, 70]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.01
  WARMUP_EPOCHS: 10
  WARMUP_METHOD: 'linear'
  COSINE_MARGIN: 0.5
  COSINE_SCALE: 30
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 30
  EVAL_PERIOD: 30
  LOG_PERIOD: 100

MOME:
  ENABLED: True
  DR_SAMPLES_PER_ID: 4

OUTPUT_DIR: './logs/rebuttal_resnet_mome/'

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
