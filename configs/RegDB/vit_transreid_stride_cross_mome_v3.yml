MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './jx_vit_base_p16_224-80ecf9dd.pth'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [12, 12]
  SIE_CAMERA: False  # the trial checkpoints were trained with SIE off via CLI; keep configs faithful
  SIE_COE: 3.0
  JPM: True
  RE_ARRANGE: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10

DATASETS:
  NAMES: ('regdb_cross')
  ROOT_DIR: './data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.008
  PARASITIC_LR_MULT: 5.0
  BIAS_LR_FACTOR: 1
  OPTIMIZER_NAME: 'SGD'
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  MAX_EPOCHS: 60
  STEPS: [20, 40]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.01
  WARMUP_EPOCHS: 5
  WARMUP_METHOD: 'linear'
  COSINE_MARGIN: 0.5
  COSINE_SCALE: 30
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 20
  EVAL_PERIOD: 10
  LOG_PERIOD: 100

MOME:
  ENABLED: True
  DR_SAMPLES_PER_ID: 4

OUTPUT_DIR: './logs/regdb_cross_mome_v3/'

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
