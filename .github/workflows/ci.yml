name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision have to come from the same build, or torchvision's C++ ops do
          # not register and every import of datasets/ dies on torchvision::nms. The tests need
          # no GPU, so both come from the CPU index.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # everything else, with those two left out so pip cannot resolve them again from PyPI
          grep -vE '^(torch|torchvision)\b' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt
          pip install pytest ruff
      - name: The two come from one build
        run: |
          python - <<'EOF'
          import torch, torchvision
          print("torch", torch.__version__, "| torchvision", torchvision.__version__)
          torchvision.ops.nms(torch.zeros(0, 4), torch.zeros(0), 0.5)   # fails loudly on a mismatch
          EOF
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .
      - name: The mechanism tests
        run: pytest tests/ -q
      - name: Every entry point parses
        run: python -m compileall -q . -x '(build|\.git)'
